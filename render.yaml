services:
  - type: web
    name: nyayai-backend
    env: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: groq/compound-mini
      - key: AGORA_APP_ID
        value: 289ce9c667fa4a64b22c36475d828ab1
      - key: AGORA_APP_CERTIFICATE
        sync: false
      # JWT_SECRET is a secret and MUST be supplied via the Render dashboard
      # (sync: false). It is never committed to the repository.
      - key: JWT_SECRET
        sync: false
